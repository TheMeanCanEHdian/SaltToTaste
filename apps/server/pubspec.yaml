name: salt_server
description: SaltToTaste backend (Dart Frog)
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

# Operator CLIs (bin/); `dart run salt_server:<name>` resolves these.
executables:
  import:
  recover:

dependencies:
  archive: ^4.0.4
  crypto: ^3.0.6
  cryptography: ^2.7.0
  dart_frog: ^1.1.0
  dart_mappable: ^4.8.0
  logging: ^1.3.0
  meta: ^1.15.0
  salt_shared:
    path: ../../packages/salt_shared
  sqlite3: ^2.7.0
  yaml: ^3.1.2

dev_dependencies:
  dart_frog_lint: ^0.1.0
  lints: ^5.1.1
  test: ^1.25.8
