<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Your household recipe library.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Salt to Taste">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: SVG for crisp scaling on modern browsers, ICO as fallback.
       The ICO is also what browsers probe for unconditionally at
       /favicon.ico whether or not it is declared here, so it must live at
       that exact name. It shipped as "favicon.png" from the first web
       build (P2): real ICO bytes under a PNG extension, declared as
       image/png. Browsers sniffed past the wrong type so the tab icon
       always looked right, while the automatic /favicon.ico probe 404ed on
       every page load. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>

  <!-- Shown until Flutter boots and sets the document title. -->
  <title>Salt to Taste</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
