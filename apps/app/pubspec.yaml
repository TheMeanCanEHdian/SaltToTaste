name: salt_app
description: SaltToTaste Flutter app (web-first, portable)
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  dio: ^5.7.0
  file_picker: ^11.0.2
  flutter_bloc: ^9.0.0
  # Renders the brand mark (assets/images/logo.svg) as a recolorable vector so
  # the circle logo stays crisp at any size; the SVG is the hand-editable source.
  flutter_svg: ^2.0.10
  forui: 0.24.0
  go_router: ^15.1.2
  lucide_icons_flutter: ^3.1.15
  # Recipe PDF export: `pdf` lays the document out, `printing` hands the
  # bytes to the platform (a file download on web, a share sheet elsewhere).
  pdf: ^3.13.0
  printing: ^5.15.0
  # Persists the session's list-layout choice (grid/list) across reloads; on
  # web this is backed by the browser's localStorage.
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  salt_shared:
    path: ../../packages/salt_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800
    # Bundled so mono text (paths, keys, import/compute logs) renders
    # offline — generic 'monospace' has no CanvasKit fallback under
    # --no-web-resources-cdn. RobotoMono is Apache-2.0.
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
    # Metric-compatible Arial/Helvetica substitute for the FDA nutrition
    # label's regulation look (generic 'Helvetica' has no offline
    # fallback). Variable font, so the label's 400/700/900 weights all
    # resolve. Arimo is OFL-1.1.
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo-Variable.ttf
