name: salt_app
description: SaltToTaste Flutter app (web-first, portable)
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  dio: ^5.7.0
  file_picker: ^11.0.2
  flutter_bloc: ^9.0.0
  forui: 0.24.0
  go_router: ^15.1.2
  lucide_icons_flutter: ^3.1.15
  url_launcher: ^6.3.0
  salt_shared:
    path: ../../packages/salt_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800
    # Bundled so mono text (paths, keys, import/compute logs) renders
    # offline — generic 'monospace' has no CanvasKit fallback under
    # --no-web-resources-cdn. RobotoMono is Apache-2.0.
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
